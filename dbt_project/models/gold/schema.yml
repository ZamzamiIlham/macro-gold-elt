version: 2

models:
  - name: fact_market_daily
    data_tests: 
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - date_id
            - asset_id
    columns:
      - name: asset_id
        tests:
          - not_null
      - name: date_id
        tests:
          - not_null
  - name: dim_asset
    columns:
      - name: asset_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  - name: dim_market_regime
    columns:
      - name: regime_id
        tests:
          - unique
          - not_null
    