x-airflow-common: &airflow-common
  build: .  # <-- Memakai Dockerfile di folder yang sama
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW_CONN_SEAWEEDFS_S3: "aws://${SEAWEED_ACCESS_KEY}:${SEAWEED_SECRET_KEY}@/?endpoint_url=http%3A%2F%2Fseaweedfs%3A8333&addressing_style=path"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    DBT_HOST: postgres
    DBT_PORT: 5432
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./dbt_project:/opt/airflow/dbt_project
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_started
    airflow-init:
      condition: service_completed_successfully
  networks:
    - macro-net

services:
  # 1. PostgreSQL (Metadata Airflow + Data Warehouse)
  postgres:
    image: postgres:15
    container_name: macro-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - macro-net

  # 2. Airflow DB Init
  airflow-init:
    build: .
    container_name: macro-airflow-init
    environment:
      <<: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      - postgres
    networks:
      - macro-net
    command: >
      bash -c "airflow db migrate && airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com"

  # 3. Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: macro-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # 4. Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: macro-airflow-scheduler
    command: scheduler

  # 5. SeaweedFS Lakehouse Storage
  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    container_name: macro-seaweedfs
    command: >
      server
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=100
      -volume.max=10
      -dir=/data
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
      - ./config/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "weed", "version"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - macro-net

  # 6. SeaweedFS Auto-Create Bucket 'bronze'
  seaweedfs-init:
    image: chrislusf/seaweedfs:3.68
    container_name: macro-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["-c", "sleep 3 && echo 's3.bucket.create -name bronze' | weed shell -master=seaweedfs:9333 && echo 'Bucket bronze created'"]
    networks:
      - macro-net

volumes:
  postgres-db-volume:
  seaweedfs_data:

networks:
  macro-net:
    driver: bridge